<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-74f2bd77-1572-48bb-a3ab-6cfa90e647f0/styles.css">
<script src="_ds/broadsheet-74f2bd77-1572-48bb-a3ab-6cfa90e647f0/_ds_bundle.js"></script>
</helmet>
<div style="position:absolute;top:{{ top }};right:62px;z-index:30;display:flex;flex-direction:column;gap:6px;width:{{ w }};max-width:1000px;opacity:{{ op }};padding:12px 20px 12px 16px;box-sizing:border-box;overflow:hidden;border-radius:32px;background:#fff;outline:1.5px solid oklch(0.7 0.17 65);box-shadow:var(--shadow-lg);transition:width .7s cubic-bezier(.2,.8,.2,1),opacity .4s;pointer-events:{{ pe }};font-family:var(--font-heading);color:var(--color-text)">
  <div style="display:flex;align-items:center;gap:14px;min-height:32px">
    <span style="width:14px;height:14px;flex:none;border-radius:50%;background:oklch(0.7 0.17 65);box-shadow:0 0 0 {{ ring }} oklch(0.9 0.1 80);transition:box-shadow .25s"></span>
    <div style="flex:1;min-width:0;font-size:18px;line-height:1.3;text-wrap:pretty"><span style="font-weight:600;color:oklch(0.5 0.15 55);margin-right:8px">TAB</span><span>{{ said }}</span><span style="color:var(--color-neutral-400)">{{ rest }}</span></div>
    <span style="flex:none;font-size:12px;letter-spacing:.14em;color:var(--color-neutral-600);white-space:nowrap">{{ meta }}</span>
    <sc-if value="{{ controls }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:4px;flex:none">
        <button onClick="{{ next }}" style="all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;background:oklch(0.7 0.17 65);color:#fff;font-size:14px;white-space:nowrap" style-hover="background:oklch(0.62 0.17 60)">{{ nextLabel }}</button>
        <button onClick="{{ stop }}" style="all:unset;cursor:pointer;padding:5px 10px;border-radius:999px;color:var(--color-neutral-700);font-size:14px" style-hover="color:var(--color-text)">Stop</button>
      </div>
    </sc-if>
    <button onClick="{{ stop }}" title="Close" style="all:unset;cursor:pointer;flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--color-neutral-600);font-size:18px" style-hover="background:var(--color-neutral-200);color:var(--color-text)">×</button>
  </div>
  <sc-if value="{{ hasChoices }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:6px;padding-left:28px;flex-wrap:wrap">
      <sc-for list="{{ choices }}" as="c" hint-placeholder-count="2">
        <button onClick="{{ c.click }}" style="all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:15px;white-space:nowrap;background:{{ c.bg }};color:{{ c.fg }};outline:1.5px solid oklch(0.7 0.17 65)" style-hover="background:oklch(0.95 0.05 80)">{{ c.label }}</button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ idle }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:12px;padding-left:28px">
      <input onKeyDown="{{ key }}" onFocus="{{ focus }}" onBlur="{{ blur }}" placeholder="Reply, or ask for anything — then Enter" style="all:unset;flex:1;min-width:0;font-size:17px;font-family:var(--font-heading);color:var(--color-text);padding:6px 0;border-bottom:1px solid var(--color-neutral-300)" style-focus="border-bottom-color:oklch(0.7 0.17 65)">
      <span style="font-size:12px;letter-spacing:.14em;color:var(--color-neutral-600);white-space:nowrap">OR SAY IT</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:260},&quot;line&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;open&quot;:true,&quot;words&quot;:[&quot;Three&quot;,&quot;things&quot;,&quot;today.&quot;,&quot;Take&quot;,&quot;you&quot;,&quot;through&quot;,&quot;them?&quot;],&quot;shown&quot;:7,&quot;meta&quot;:&quot;&quot;,&quot;choices&quot;:[{&quot;id&quot;:&quot;both&quot;,&quot;label&quot;:&quot;Out loud + on screen&quot;},{&quot;id&quot;:&quot;no&quot;,&quot;label&quot;:&quot;I've got it&quot;}]},&quot;tsType&quot;:&quot;object&quot;},&quot;nextLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Next&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onNext&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onStop&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onAsk&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(text:string)=&gt;void&quot;},&quot;onTyping&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(on:boolean)=&gt;void&quot;},&quot;onChoice&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const L = this.props.line || { open: false, words: [], shown: 0 };
    const words = L.words || [], n = L.shown || 0, ch = L.choices || [];
    return {
      top: this.props.top || '142px', w: L.open ? (L.controls ? '1000px' : '900px') : '0px', op: L.open ? 1 : 0, pe: L.open ? 'auto' : 'none',
      ring: L.speaking ? '6px' : '0px', meta: L.meta || '', idle: !!L.open && !!L.idle && !ch.length,
      said: words.slice(0, n).join(' ') + (n && n < words.length ? ' ' : ''), rest: words.slice(n).join(' '),
      controls: !!L.controls, nextLabel: this.props.nextLabel || 'Next',
      hasChoices: !!L.open && ch.length > 0 && n >= words.length,
      choices: ch.map((c, i) => ({ label: c.label, bg: i === 0 ? 'oklch(0.7 0.17 65)' : '#fff', fg: i === 0 ? '#fff' : 'var(--color-text)', click: () => this.props.onChoice && this.props.onChoice(c.id) })),
      next: () => this.props.onNext && this.props.onNext(), stop: () => this.props.onStop && this.props.onStop(),
      key: e => { if (e.key === 'Enter' && e.target.value.trim()) { const t = e.target.value.trim(); e.target.value = ''; this.props.onAsk && this.props.onAsk(t); } },
      focus: () => this.props.onTyping && this.props.onTyping(true), blur: () => this.props.onTyping && this.props.onTyping(false)
    };
  }
}
</script>
</body>
</html>

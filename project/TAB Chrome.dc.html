<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:36px;height:56px;padding:0 48px;font-family:var(--font-heading)">
  <div style="font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--color-accent-2)">TAB</div>
  <div style="display:flex;gap:28px;flex:1">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <button onClick="{{ t.go }}" style="all:unset;cursor:pointer;font-size:17px;font-weight:{{ t.w }};color:{{ t.c }};display:flex;gap:8px;align-items:baseline" style-hover="opacity:.7">
        <span>{{ t.label }}</span><span style="font-size:12px;color:var(--color-neutral-600);font-weight:400">{{ t.n }}</span>
      </button>
    </sc-for>
  </div>
  <div style="font-size:15px;color:var(--color-neutral-600);font-style:italic">{{ time }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:56},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mon 5 Oct · 8:40&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tabs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[][]&quot;},&quot;onGo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = Number(this.props.active ?? 0);
    const P = this.props.tabs || [['Briefs','3 folders'],['Text','4 versions'],['Call','10:30 Northwind'],['Parked','14 tabs'],['Unified','TAB\'s record']];
    return { time: this.props.time || 'Mon 5 Oct · 8:40', tabs: P.map((p, i) => ({ label: p[0], n: p[1], w: i === a ? 700 : 400, c: i === a ? 'var(--color-accent-700)' : 'var(--color-text)', go: () => this.props.onGo && this.props.onGo(i) })) };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAB@Work הציר הרוחבי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600;700&family=Heebo:wght@400;500;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout idea: one open sheet of paper. The 3D spine fills it; TAB speaks in one pill on top, one feed line at the bottom. No panels. */
:root{
  color-scheme:light;
  --paper:#f3f2f2; --surface:#ffffff; --ink:#201e1d; --muted:#6b6663; --hair:#d9d6d3;
  --cyan:#0088b0; --cyan-deep:#00627f; --magenta:#d6006c;
  --tab:oklch(0.7 0.17 65); --tab-deep:oklch(0.45 0.15 55); --tab-btn:oklch(0.55 0.17 55); --tab-tint:oklch(0.95 0.05 80);
  --ok:#3b8f6a; --maint:#7a7572;
  --font-display:'Frank Ruhl Libre','David Libre','David','Times New Roman',serif;
  --font-body:'Heebo','Arial',sans-serif;
  --shadow:0 1px 2px rgba(32,30,29,.08),0 10px 30px rgba(32,30,29,.12);
}
html[lang="en"]{--font-display:'Source Serif 4',Georgia,serif;--font-body:'Source Serif 4',Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--cyan-deep);outline-offset:2px}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;top:0;left:0;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--ink);background:none;border:0;padding:4px 8px;cursor:pointer;pointer-events:auto;text-shadow:0 0 6px var(--paper),0 0 6px var(--paper),0 0 2px var(--paper)}
.lab small{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:var(--muted);text-align:center}
.lab.quiet{font-weight:400;font-size:13px;color:var(--muted)}
.lab.on{color:var(--tab-deep)}

/* top: masthead + TAB line */
#top{position:fixed;top:0;left:0;right:0;padding:12px 16px 18px;background:linear-gradient(var(--paper) 55%,rgba(243,242,242,0));display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:5}
#mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#mast h1{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.01em}
#mast h1 span{font-weight:400;color:var(--muted);font-size:14px;margin-inline-start:8px}
#mast .right{display:flex;gap:10px;align-items:baseline;pointer-events:auto}
#demoTag{font-size:12px;color:var(--muted)}
#lang{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border-radius:999px;color:var(--cyan-deep)}
#lang:hover{background:#e6eef1}
#line{pointer-events:auto;align-self:flex-start;max-width:min(720px,100%);background:var(--surface);border-radius:26px;outline:1.5px solid var(--tab);box-shadow:var(--shadow);padding:10px 14px 10px 16px;display:flex;flex-direction:column;gap:8px;font-family:var(--font-display)}
#lineRow{display:flex;align-items:flex-start;gap:10px}
#dot{flex:none;width:12px;height:12px;margin-top:7px;border-radius:50%;background:var(--tab);transition:box-shadow .25s}
#line.speaking #dot{box-shadow:0 0 0 5px oklch(0.9 0.1 80)}
#said{flex:1;min-width:0;font-size:17px;line-height:1.4;text-wrap:pretty}
#said b{font-weight:600;color:var(--tab-deep);margin-inline-end:6px}
#said .rest{color:#b5b0ac}
#stepMeta{flex:none;font-family:var(--font-body);font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
#lineX{all:unset;cursor:pointer;flex:none;width:30px;height:30px;margin-top:-3px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:21px;color:var(--muted)}
#lineX:hover{background:#eceae8;color:var(--ink)}
#line.min{cursor:pointer;padding:7px 14px 7px 12px;margin-inline-start:-16px;border-radius:999px;border-start-start-radius:0;border-end-start-radius:0}
#line.min:hover{background:var(--tab-tint)}
#line.min #lineBtns,#line.min #stepMeta,#line.min #lineX{display:none!important}
#line.min #dot{margin-top:5px}
#line.min #said b{margin:0}
#lineBtns{display:flex;flex-wrap:wrap;gap:6px;padding-inline-start:22px}
.pill{all:unset;cursor:pointer;padding:6px 15px;border-radius:999px;font-family:var(--font-body);font-size:14.5px;white-space:nowrap;outline:1.5px solid var(--tab);background:var(--surface)}
.pill:hover{background:var(--tab-tint)}
.pill.primary{background:var(--tab-btn);color:#fff}
.pill.primary:hover{background:oklch(0.48 0.17 55)}
.pill.ghost{outline:0;color:var(--muted)}
.pill.ghost:hover{color:var(--ink);background:none}
a.pill{text-decoration:none;color:var(--ink)}
.mail{font-family:var(--font-body);font-size:16px;direction:ltr;unicode-bidi:isolate;user-select:all;color:var(--cyan-deep)}

/* bottom: feed line + legend */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none;z-index:4}
#legend{display:none;flex-wrap:wrap;gap:4px 14px;font-size:13px;pointer-events:auto;background:var(--surface);padding:8px 12px;border-radius:14px;box-shadow:var(--shadow)}
#legend.open{display:flex}
.key{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.glyph{width:11px;height:11px;flex:none;display:inline-block;background:var(--c)}
.glyph.ok{border-radius:50%}
.glyph.pred{clip-path:polygon(50% 0,100% 100%,0 100%)}
.glyph.defect{transform:rotate(45deg) scale(.82)}
.glyph.sec{clip-path:polygon(50% 0,100% 22%,100% 60%,50% 100%,0 60%,0 22%)}
.glyph.maint{border-radius:2px;background:none;border:2.5px solid var(--c)}
.glyph.dir{clip-path:polygon(0 35%,60% 35%,60% 0,100% 50%,60% 100%,60% 65%,0 65%)}
#feedRow{display:flex;align-items:center;gap:10px;max-width:100%;pointer-events:auto;background:rgba(243,242,242,.88);border-radius:14px}
#ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:auto}
#legendBtn,#mvBtn{all:unset;cursor:pointer;flex:none;font-size:13px;color:var(--cyan-deep);padding:6px 10px;border-radius:999px;background:rgba(243,242,242,.88)}
#legendBtn:hover,#mvBtn:hover{background:#e6eef1}
#mvBtn[aria-pressed="true"]{background:var(--cyan-deep);color:#fff}
#seg{display:inline-flex;background:var(--surface);border-radius:999px;box-shadow:0 0 0 1px var(--hair);padding:2px}
#seg button{all:unset;cursor:pointer;font-size:13px;padding:5px 12px;border-radius:999px;color:var(--muted);white-space:nowrap}
#seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.glyph.fig{width:9px;height:13px;border-radius:50% 50% 2px 2px}
.sep{flex-basis:100%;height:0}
#card h3{margin:12px 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#feed{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;min-width:0;font-size:14px;line-height:1.35;padding:6px 10px;border-radius:12px}
#feed:hover{background:rgba(255,255,255,.7)}
#feed .txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#feed time{flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* detail card */
#card{position:fixed;inset-inline-start:16px;bottom:14px;width:min(420px,calc(100% - 32px));max-height:52%;overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px 18px;z-index:6;display:none}
#card.open{display:block}
#card .kicker{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--magenta)}
#card h2{margin:4px 0 8px;font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.15;text-wrap:balance;padding-inline-end:34px}
#card p{margin:0 0 8px;font-size:15.5px;line-height:1.55}
#card p.note{color:var(--muted);font-size:14px}
#card .x{all:unset;cursor:pointer;position:absolute;top:10px;inset-inline-end:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:22px;color:var(--muted)}
#card .x:hover{background:#eceae8;color:var(--ink)}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:14px;font-variant-numeric:tabular-nums}
table.ledger{width:100%;border-collapse:collapse;margin:4px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
table.ledger th{font-weight:500;color:var(--muted);text-align:start;padding:2px 0;font-size:12px}
table.ledger td{padding:2.5px 0;border-top:1px solid var(--hair)}
table.ledger td.n,table.ledger th.n{text-align:end;width:4.5em}
.pending{margin-top:10px;padding:10px 12px;background:var(--tab-tint);border-radius:12px;font-size:14.5px;line-height:1.5;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* summary dialog */
#veil{position:fixed;inset:0;background:rgba(32,30,29,.28);z-index:9;display:none;align-items:center;justify-content:center;padding:16px}
#veil.open{display:flex}
#sum{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:86%;overflow:auto;padding:22px 22px 18px;position:relative}
#sum h2{margin:0 0 10px;font-family:var(--font-display);font-size:26px;font-weight:600}
#sumText{white-space:pre-wrap;font-size:15.5px;line-height:1.6;margin:0 0 14px;font-family:var(--font-body)}
#sum .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#copied{font-size:13px;color:var(--ok)}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:var(--font-display);font-size:20px}
@media (max-width:520px){
  #mast h1{font-size:18px} #mast h1 span{display:none}
  #said{font-size:16px} .lab{font-size:13.5px} .lab small{font-size:11px}
  #card{max-height:50%;padding:14px 16px 14px}
  #card h2{font-size:21px;margin-bottom:6px}
  #card p{font-size:14.5px;line-height:1.45;margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="top">
  <div id="mast">
    <h1>TAB@Work<span id="sub"></span></h1>
    <div class="right"><span id="demoTag"></span><button id="lang" type="button"></button></div>
  </div>
  <div id="line" role="status" aria-live="polite">
    <div id="lineRow"><span id="dot" aria-hidden="true"></span><div id="said"></div><span id="stepMeta"></span><button id="lineX" type="button">×</button></div>
    <div id="lineBtns"></div>
  </div>
</div>

<div id="bottom">
  <div id="legend"></div>
  <div id="feedRow">
    <button id="feed" type="button"><span class="glyph ok" style="--c:var(--ok)"></span><span class="txt"></span><time></time></button>
  </div>
  <div id="ctl">
    <div id="seg" role="group"><button id="segOff" type="button"></button><button id="segOn" type="button"></button></div>
    <button id="mvBtn" type="button" aria-pressed="false"></button>
    <button id="legendBtn" type="button" aria-expanded="false"></button>
  </div>
</div>

<div id="card" role="dialog" aria-labelledby="cardTitle"></div>

<div id="veil"><div id="sum" role="dialog" aria-labelledby="sumTitle">
  <h2 id="sumTitle"></h2>
  <pre id="sumText"></pre>
  <div class="row"><button class="pill primary" id="copyBtn" type="button"></button><button class="pill ghost" id="sumClose" type="button"></button><span id="copied" role="status"></span></div>
</div></div>
<div id="nogl"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

       'לכיוון העובדים: תקינות, כשלים צפויים, ליקויים, אבטחה ותחזוקה מטופלים במקום. המסלול עוקף את התקלה במקום להתריע עליה.',
       'לכיוון ההנהלה: תמונה מצטברת ואנונימית לצוות הסוכנים שלה. סופרים אירועים, לא אנשים. החלטות יורדות חזרה על אותו ציר.']
      :['Without the spine, an unsettled directive travels from management to the middle manager to the employee and comes back as a guess. Every round smears time, and the middle manager remains the only translator.',
        'The spine is an extension cord laid along the operating system infrastructure, opening a new, fast route through the organization.',
        'Sockets run along it: every department, tool or team plugs in at one point, without changing the spine.',
        'Each department has a lead agent surrounded by the employees’ personal agents. A personal agent is loyal to its employee.',
        'Toward employees: health, predicted failures, defects, security and maintenance are handled in place. The route bypasses the problem instead of raising an alert.',
        'Toward management: an aggregate, anonymous picture for its agent team. It counts events, not people. Decisions travel back down the same spine.'])
  .forEach(function(s,i){L.push((i+1)+'. '+s)});
  var names=[];visited.forEach(function(k){var kind=k.split(':')[0],id=k.split(':')[1];var dn=(id&&deptObj[id])?t(deptObj[id].d):'';var n=kind==='dept'?dn:kind==='mgmt'?t(S.mgmt):kind==='free'?t(S.free):kind==='os'?t(S.os):kind==='mm'?(t(S.mm)+' ('+dn+')'):(CARD[kind]?t(CARD[kind].k)+(dn?' ('+dn+')':''):null);if(n&&names.indexOf(n)<0)names.push(n)});
  var plugged=DEPTS.filter(function(d){return d.id.charAt(0)==='x'}).map(function(d){return t(d)});
  L.push('');
  if(plugged.length)L.push((he?'חובר לשקע פנוי: ':'Plugged into a free socket: ')+plugged.join(', ')+'.');
  if(names.length)L.push((he?'מה נפתח בסיור הזה: ':'Opened in this visit: ')+names.join(', ')+'.');
  var tot=0,byp=0;DEPTS.forEach(function(d){tot+=counts[d.id].total;byp+=counts[d.id].bypassed});
  L.push(he?('בזמן הצפייה עברו על הציר '+tot+' אירועים, מתוכם '+byp+' נעקפו'+(pending.length?(' ו-'+pending.length+' ממתינים להחלטת הנהלה'):'')+'. הנתונים מומצאים לצורך הדמו.')
           :('During this visit '+tot+' events crossed the spine, '+byp+' of them bypassed'+(pending.length?(' and '+pending.length+' waiting for a management decision'):'')+'. The data is invented for this demo.'));
  L.push('');L.push((he?'להמשך: ':'Next: ')+MAIL+' · '+(he?'שולחן העבודה של TAB: ':'TAB work desk: ')+deskUrl());
  return L.join('\n')}
function openSummary(){$('sumTitle').textContent=t(S.sumTitle);$('sumText').textContent=summaryText();$('copyBtn').textContent=t(S.copy);$('sumClose').textContent=t(S.close);$('copied').textContent='';$('veil').classList.add('open');$('copyBtn').focus()}
$('sumClose').addEventListener('click',function(){$('veil').classList.remove('open')});
$('veil').addEventListener('click',function(e){if(e.target===$('veil'))$('veil').classList.remove('open')});
$('copyBtn').addEventListener('click',function(){var done=function(){$('copied').textContent=t(S.copied)},fail=function(){$('copied').textContent=t(S.copyFail);var r=document.createRange();r.selectNodeContents($('sumText'));var s=window.getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText($('sumText').textContent).then(done,fail)}catch(e){fail()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('veil').classList.contains('open'))$('veil').classList.remove('open');else if(cardKey)closeCard()}});

/* ---------- language ---------- */
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
  $('sub').textContent=t(S.sub);$('demoTag').textContent=t(S.demo);$('lang').textContent=t(S.lang);$('legendBtn').textContent=t(S.legend);$('lineX').setAttribute('aria-label',t(S.minTab));$('lineX').title=t(S.minTab);
  labelText();buildLegend();paintFeed();if(cardKey)renderCard(cardKey);
  $('segOff').textContent=t(S.off);$('segOn').textContent=t(S.on);$('mvBtn').textContent=t(S.mv);$('segOn').setAttribute('aria-pressed',spineOn?'true':'false');$('segOff').setAttribute('aria-pressed',spineOn?'false':'true');
  if(resay)resay();else intro();
  if($('veil').classList.contains('open'))openSummary()}
$('lang').addEventListener('click',function(){lang=lang==='he'?'en':'he';try{localStorage.setItem('tabspine-lang',lang)}catch(e){}applyLang()});

/* ---------- picking ---------- */
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),down=null;
renderer.domElement.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY};tween=null});
renderer.domElement.addEventListener('pointerup',function(e){if(!down)return;var dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(dx*dx+dy*dy>49)return;
  var r=renderer.domElement.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  var hits=ray.intersectObjects(picks,false).filter(function(h){for(var n=h.object;n;n=n.parent){if(!n.visible&&n.type==='Group')return false}return true});if(!hits.length){if(cardKey)closeCard(true);return}
  var order={event:0,person:1,lead:1,mm:1,socket:2,free:2,mgmt:3,spine:4,dept:5,os:6};var best=hits[0];
  for(var i=1;i<hits.length&&hits[i].distance-hits[0].distance<1.2;i++){if(order[hits[i].object.userData.key.split(':')[0]]<order[best.object.userData.key.split(':')[0]])best=hits[i]}
  openCard(best.object.userData.key)});

/* ---------- loop ---------- */
function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
var rz;window.addEventListener('resize',function(){resize();clearTimeout(rz);rz=setTimeout(function(){if(!cardKey&&mode!=='seq')go('all',true)},150)});
var last=performance.now(),ambAcc=0,evAcc=6;
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;
  if(tween){tween.k=Math.min(1,tween.k+dt/1.1);var k=tween.k,e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(k>=1)tween=null}
  controls.update();
  ambAcc+=dt;if(ambAcc>(reduce?2.4:(spineOn?.75:1.1))&&!(mode==='seq'&&seq===STORY)){ambAcc=0;if(pulses.length<26)ambient()}
  if(mode!=='seq'&&spineOn){evAcc+=dt;if(evAcc>7){evAcc=0;fireEvent(evIdx++)}}
  for(var i=pulses.length-1;i>=0;i--){var p=pulses[i];p.s+=p.v*dt;var s=p.s,j=0;while(j<p.segs.length&&s>p.segs[j]){s-=p.segs[j];j++}
    if(j>=p.segs.length){scene.remove(p.m);if(p.big){var ix=picks.indexOf(p.m.children[0]);if(ix>=0)picks.splice(ix,1)}pulses.splice(i,1);if(p.done)p.done();continue}
    p.m.position.lerpVectors(p.pts[j],p.pts[j+1],s/p.segs[j])}
  Object.keys(deptObj).forEach(function(id){var o=deptObj[id];if(o.ringT>=0){o.ringT+=dt/1.4;var k2=o.ringT;o.ring.scale.setScalar(.6+k2*1.9);o.ring.material.opacity=Math.max(0,.75*(1-k2));if(k2>=1){o.ringT=-1;o.ring.material.opacity=0}}});
  renderer.render(scene,camera);placeLabels();requestAnimationFrame(frame)}

resize();applyLang();go('all',true);
for(var i=0;i<8;i++)ambient();
pulses.forEach(function(p){p.s=Math.random()*p.L*.8});
requestAnimationFrame(frame);
})();
</script>

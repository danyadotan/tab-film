<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAB Chrome עברית</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="display:flex;align-items:center;gap:36px;height:56px;padding:0 48px;font-family:var(--font-heading);direction:rtl">
  <div style="font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--color-accent-2)">TAB</div>
  <div style="display:flex;gap:30px;flex:1">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <button onClick="{{ t.go }}" style="all:unset;cursor:pointer;font-size:19px;font-weight:{{ t.w }};color:{{ t.c }};display:flex;gap:8px;align-items:baseline" style-hover="opacity:.7">
        <span>{{ t.label }}</span><span style="font-size:14px;color:var(--color-neutral-700);font-weight:400">{{ t.n }}</span>
      </button>
    </sc-for>
  </div>
  <div style="font-size:16px;color:var(--color-neutral-700)">{{ time }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:56},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;יום ב׳ 5 באוק׳ · 8:40&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tabs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[][]&quot;},&quot;onGo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = Number(this.props.active ?? 0);
    const P = this.props.tabs || [['היום', '3 דברים'], ['כתיבה', 'מסמך v4, שני עותקים'], ['שיחה', '10:30 Northwind'], ['סגירה', '17:48']];
    return { time: this.props.time || 'יום ב׳ 5 באוק׳ · 8:40', tabs: P.map((p, i) => ({ label: p[0], n: p[1], w: i === a ? 700 : 400, c: i === a ? 'var(--color-accent-700)' : 'var(--color-text)', go: () => this.props.onGo && this.props.onGo(i) })) };
  }
}
</script>
</body>
</html>
